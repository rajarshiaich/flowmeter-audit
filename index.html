<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a1628">
<title>ONGC Flow Meter Audit</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--navy:#0a1628;--navy2:#112240;--navy3:#1a3a5c;--accent:#f5a623;--green:#2ecc71;--red:#e74c3c;--text:#e8edf4;--text2:#8899aa;--border:rgba(255,255,255,0.1);--card:rgba(255,255,255,0.04);--r:10px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--navy);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.header{background:var(--navy2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;padding:0 14px}
.header-top{display:flex;align-items:center;justify-content:space-between;height:54px}
.logo-badge{background:var(--accent);color:var(--navy);font-weight:800;font-size:11px;padding:3px 7px;border-radius:4px}
.logo-title{font-size:13px;font-weight:600;margin-left:7px}
.logo-sub{font-size:10px;color:var(--text2);margin-left:7px}
.hbtns{display:flex;gap:5px}
.btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:7px;font-size:11px;cursor:pointer;white-space:nowrap}
.btn:active{opacity:.7}
.btn-export{background:var(--accent);border-color:var(--accent);color:var(--navy);font-weight:700}
.btn-reset{background:rgba(231,76,60,.12);border-color:var(--red);color:var(--red)}
.btn-import{background:rgba(46,204,113,.1);border-color:var(--green);color:var(--green)}
.nav-tabs{display:flex;overflow-x:auto;gap:4px;padding:7px 0;scrollbar-width:none}
.nav-tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:5px 13px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text2)}
.tab.active{background:var(--accent);border-color:var(--accent);color:var(--navy);font-weight:700}
.main{padding:14px;max-width:780px;margin:0 auto}
.ptitle{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:10px;text-transform:uppercase;letter-spacing:.7px}
.sc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.sh{padding:10px 13px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none}
.sl{font-size:10px;font-weight:700;color:var(--accent);letter-spacing:.7px;text-transform:uppercase}
.st{font-size:13px;font-weight:600;margin-top:1px}
.sv{color:var(--text2);font-size:15px;transition:transform .2s;flex-shrink:0;margin-left:6px}
.sc.open .sv{transform:rotate(180deg)}
.sb{display:none;padding:0 11px 11px}
.sc.open .sb{display:block}
.fl{font-size:10px;color:var(--text2);margin-bottom:3px;text-transform:uppercase;letter-spacing:.4px}
.fi{width:100%;background:var(--navy2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;padding:7px 10px;outline:none;-webkit-appearance:none}
.fi:focus{border-color:var(--accent)}
.fi::placeholder{color:var(--text2)}
textarea.fi{resize:vertical;min-height:52px;font-family:inherit}
select.fi{cursor:pointer}
select.fi option{background:var(--navy2)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.cp-row{border-top:1px solid var(--border);padding:8px 0}
.cp-row:first-child{border-top:none}
.cp-id{font-size:10px;font-weight:700;color:var(--accent);min-width:24px;display:inline-block}
.cp-text{font-size:12px;line-height:1.4;margin-bottom:6px}
.cp-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.ci{width:100%;background:var(--navy2);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:12px;padding:6px 8px;outline:none;-webkit-appearance:none}
.ci:focus{border-color:var(--accent)}
.ci::placeholder{color:rgba(136,153,170,.55)}
select.ci{cursor:pointer}
select.ci option{background:var(--navy2)}
.mm{background:var(--navy2);border:1px solid var(--border);border-radius:var(--r);padding:12px;margin-bottom:13px}
.mm-title{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px}
.mt-wrap{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mt{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text2);position:relative}
.mt.am{background:var(--navy3);border-color:var(--accent);color:var(--text)}
.mt .db{position:absolute;top:-4px;right:-4px;background:var(--red);border:none;color:#fff;border-radius:50%;width:14px;height:14px;font-size:9px;display:none;align-items:center;justify-content:center;cursor:pointer}
.mt:hover .db{display:flex}
.add-m{padding:5px 11px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px dashed var(--accent);background:transparent;color:var(--accent)}
.mhf{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.cs-section{margin-bottom:18px}
.dt{width:100%;border-collapse:collapse;font-size:12px}
.dt th{background:var(--navy3);color:var(--text2);font-size:10px;text-transform:uppercase;letter-spacing:.4px;padding:6px 7px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
.dt td{padding:5px 5px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:middle}
.dt td input,.dt td select{width:100%;background:transparent;border:none;color:var(--text);font-size:12px;outline:none;padding:2px 3px;-webkit-appearance:none}
.dt td select option{background:var(--navy2)}
.dt td:focus-within{background:rgba(245,166,35,.07)}
.add-row{width:100%;padding:7px;border:1px dashed var(--border);background:transparent;color:var(--text2);font-size:12px;border-radius:6px;cursor:pointer;margin-top:6px}
.st-table{width:100%;border-collapse:collapse;font-size:11px}
.st-table th{background:var(--navy3);color:var(--text2);font-size:10px;text-transform:uppercase;letter-spacing:.4px;padding:6px 7px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
.st-table td{padding:5px 6px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle;color:var(--text)}
.st-table td:nth-child(2){color:var(--text2);font-size:10px;font-style:italic}
.st-table td select{width:100%;background:var(--navy2);border:1px solid var(--border);color:var(--text);font-size:11px;padding:4px 5px;border-radius:5px;outline:none;cursor:pointer;-webkit-appearance:none}
.st-table td select option{background:var(--navy2)}
.tagmgr{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.tpill{display:inline-flex;align-items:center;gap:3px;background:var(--navy3);border:1px solid var(--border);border-radius:12px;padding:3px 9px;font-size:11px}
.tpill .trm{background:none;border:none;color:var(--text2);cursor:pointer;font-size:11px;padding:0}
.tag-edit:focus{outline:1px solid var(--accent);border-radius:3px;background:rgba(245,166,35,.08)!important}
.add-tag{background:transparent;border:1px dashed var(--border);color:var(--text2);border-radius:12px;padding:3px 9px;font-size:11px;cursor:pointer}
.obs-row{background:var(--navy2);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:10px;position:relative}
.obs-del{position:absolute;top:6px;right:6px;background:transparent;border:none;color:var(--red);cursor:pointer;font-size:15px}
.obs-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.add-obs{width:100%;padding:8px;border:1px dashed var(--accent);background:transparent;color:var(--accent);font-size:13px;font-weight:600;border-radius:7px;cursor:pointer;margin-top:8px}
.pw{margin-bottom:13px}
.pl{display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-bottom:4px}
.pb{height:4px;background:var(--border);border-radius:2px}
.pf{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.empty{text-align:center;padding:34px 18px;color:var(--text2)}
.empty .icon{font-size:36px;margin-bottom:8px}
.empty p{font-size:13px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;font-weight:600;z-index:9999;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap}
.toast.show{opacity:1}
.import-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:5000;display:flex;align-items:center;justify-content:center;padding:16px}
.import-box{background:var(--navy2);border:1px solid var(--border);border-radius:14px;padding:20px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto}
.import-box h3{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:12px}
.import-log{background:var(--navy);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:11px;color:var(--text2);max-height:240px;overflow-y:auto;line-height:1.8;white-space:pre-wrap;word-break:break-all}
.import-log .ok{color:var(--green)}
.import-log .warn{color:var(--accent)}
.import-log .err{color:var(--red)}
.import-close{margin-top:12px;width:100%;padding:9px;background:var(--accent);border:none;border-radius:8px;color:var(--navy);font-weight:700;font-size:13px;cursor:pointer}
@media(max-width:440px){.cp-grid,.mhf,.frow,.obs-grid{grid-template-columns:1fr}.hbtns .btn{padding:5px 7px;font-size:10px}}
</style>
</head>
<body>
<div class="header">
  <div class="header-top">
    <div style="display:flex;align-items:center">
      <span class="logo-badge">ONGC</span>
      <div><div class="logo-title">Flow Meter Audit</div><div class="logo-sub">Field Checklist · Offline PWA</div></div>
    </div>
    <div class="hbtns">
      <button class="btn" onclick="saveData()">💾 Save</button>
      <button class="btn btn-reset" onclick="resetAll()">🗑 Reset</button>
      <button class="btn btn-import" onclick="triggerImport()" title="Import from Excel">⬆ Import</button>
      <button class="btn btn-export" onclick="exportXLSX()">⬇ Export</button>
      <input type="file" id="importFile" accept=".xlsx,.xls" multiple style="display:none" onchange="importXLSX(this.files)">
    </div>
  </div>
  <div class="nav-tabs" id="navTabs"></div>
</div>
<div class="main" id="mainContent"></div>
<div class="toast" id="toast"></div>
<div class="import-modal" id="importModal" style="display:none">
  <div class="import-box">
    <h3>📥 Excel Import Log</h3>
    <div class="import-log" id="importLog">Processing...</div>
    <button class="import-close" onclick="closeImportModal()">Done</button>
  </div>
</div>
<script>
// ── CONSTANTS ──────────────────────────────────────────────────
const METER_TYPES=['Orifice','USM','MFM','TFM','Flare','GC','Weighbridge'];
const PAGES=[{id:'cover',label:'📋 Cover'},{id:'data',label:'📊 Asset Data'},{id:'desc',label:'🗂 Description'},{id:'meters',label:'⚙ Meters'},{id:'obs',label:'⚠ Observations'}];
const OBS_CAT=['','Construction Deficiency','System Issue','Configuration Error','Calibration Gap','Maintenance Lapse','Security Concern','Upstream Process Issue','Documentation Gap'];
const OBS_PRI=['','NC - Critical','NC - High','NC - Moderate'];
const COMP=['','Complied','Not Complied','N/A'];

const CAL_SCHEDULES=[
  {label:'Orifice Meter',key:'orifice',rows:[
    {a:'Calibration of DPT',s:'Every 3 months or GSA, whichever is lower'},
    {a:'Calibration of PT',s:'Every 3 months or GSA, whichever is lower'},
    {a:'Calibration of TT',s:'Every 3 months or GSA, whichever is lower'},
    {a:'Calibration of RTD',s:'Every Year'},
    {a:'Meter Tube Inspection',s:'Every Year'},
  ]},
  {label:'USM',key:'usm',rows:[
    {a:'Diagnostic and Zero Check',s:'Every 6 months'},
    {a:'Calibration of PT',s:'Every 6 months or GSA/COSA, whichever is lower'},
    {a:'Calibration of TT',s:'Every 6 months or GSA/COSA, whichever is lower'},
    {a:'Calibration of RTD',s:'Every Year'},
    {a:'Meter Calibration',s:'Every 5 years or GSA/COSA, whichever is lower'},
  ]},
  {label:'MFM (Coriolis)',key:'mfm',rows:[
    {a:'Diagnostic and Zero Check',s:'Every 6 months'},
    {a:'Calibration of PT',s:'Every 6 months or GSA/COSA, whichever is lower'},
    {a:'Calibration of TT',s:'Every 6 months or GSA/COSA, whichever is lower'},
    {a:'Calibration of RTD',s:'Every Year'},
    {a:'Meter Inspection',s:'Every Year'},
    {a:'Meter Calibration',s:'Every 5 years or COSA, whichever is lower'},
  ]},
  {label:'Turbine Meter (TFM)',key:'tfm',rows:[
    {a:'Calibration of PT',s:'Every 6 months or GSA/COSA, whichever is lower'},
    {a:'Calibration of TT',s:'Every 6 months or GSA/COSA, whichever is lower'},
    {a:'Calibration of RTD',s:'Every Year'},
    {a:'Meter Proving',s:'Every 2 years'},
  ]},
  {label:'Flow Computer',key:'fc',tagLabel:'FC Tag',rows:[

  ]},
  {label:'Metering System',key:'ms',rows:[
    {a:'Validation by FCRI / BV / SGS etc.',s:'Any change in system configuration'},
  ]},
];

// ── CHECKLISTS ──────────────────────────────────────────────────
const CL={
Orifice:[
  {sec:'A',title:'Primary Element — Orifice Plate & Meter Run',items:[
    {id:'A1',t:'Make / Model / Serial No. of primary device (orifice plate)'},
    {id:'A2',t:'Bore diameter d (mm) — as per AGA-3 certified report'},

    {id:'A4',t:'Beta ratio (d/D) — confirm within AGA-3 limits (0.3–0.75)'},

    {id:'A20',t:'Orifice plate last physical inspection date and bore measurement recorded'},

    {id:'A23',t:'Upstream scrubber / separator available and LCV in auto mode'},

    {id:'A25',t:'Operating DP: What % of calibrated DP span? Target: 40–60% of span'},
  ]},
  {sec:'B',title:'Secondary Instruments',items:[
    {id:'B1',t:'DPT / MVT: Make / Model / Range / Serial No.'},
    {id:'B2',t:'DPT calibration span optimised so operating DP = 40–60% of span'},
    {id:'B3',t:'PT (Static pressure transmitter): Make / Model / Range'},

  {sec:'C',title:'Flow Computer / Tertiary Device',items:[

    {id:'C3',t:'FC security / password protection enabled'},
    {id:'C4',t:'FC calibration port sealed when not in use'},
    {id:'C5',t:'FC configuration backup file available and dated'},
    {id:'C6',t:'FC firmware version recorded; updates notified to ONGC'},
    {id:'C7',t:'FC covered / protected from direct sunlight and atmospheric effects'},
    {id:'C8',t:'FC on UPS (battery backup). Battery voltage monitored in FC.'},

    {id:'C10',t:'FC integrated to SCADA / DCS. Live readings matching.'},
    {id:'C11',t:'SAP PRA auto-pickup of totalizer (Yes/No)'},

  {sec:'D',title:'Flow Computer Configuration',items:[

    {id:'D6',t:'Contract hour (06:00 hrs) entered correctly'},
    {id:'D7',t:'Orifice bore d, pipe bore D, material, expansion coefficients per AGA-3'},

    {id:'D11',t:'Static pressure tapping location in FC matches physical location'},
    {id:'D12',t:'No fixed / keypad values for P or T (all live transmitter inputs)'},

    {id:'D14',t:'Gas analysis update frequency: fortnightly (1st and 16th) per GSA'},

  {sec:'E',title:'Calibration & Validation',items:[
    {id:'E1',t:'Present calibration frequency being followed (monthly / quarterly / as per GSA)'},
    {id:'E2',t:'Calibration frequency matches GSA requirement'},
    {id:'E3',t:'Unmeasured gas/fluid during calibration process quantified and stated in report'},
    {id:'E4',t:'Seal nos. (as-found AND as-left) documented in calibration report'},
    {id:'E5',t:'SAP t-code ZPMCALIB used for generating calibration record'},
    {id:'E6',t:'FC validation with (Kelton/equivalent) software. Zair, Zb, Zf documented.'},
    {id:'E7',t:'Local atmospheric pressure report available and updated at each calibration'},
    {id:'E8',t:'Master calibration instruments (DPT, PT, TT) calibrated from NABL lab (ISO 17025)'},
    {id:'E9',t:'Last joint meter run validation report available (Third Party / GAIL / Consumer)'},
    {id:'E10',t:'Last orifice plate change / re-certification report (if applicable)'},
    {id:'E11',t:'Flow computer validation (3rd party) record — every year'},
  ]},
  {sec:'F',title:'Documentation & SOP',items:[
    {id:'F1',t:'Approved SOP for CTM calibration available at plant and followed'},
    {id:'F2',t:'Approved SOP for CTM maintenance available at plant'},
    {id:'F3',t:'GSA / COSA document available at installation (not only at head office)'},
    {id:'F4',t:'CTM spares (DPT, PT, RTD, manifold valves, orifice plate) available on site'},
    {id:'F5',t:'Existing FC model is within OEM active lifecycle (not obsolete)'},
  ]},
  {sec:'G',title:'General / Safety',items:[
    {id:'G1',t:'All DPT, PT, TT, FC suitable for hazardous area (Ex certification available)'},
    {id:'G2',t:'Metering skid elevated from ground (no water logging risk)'},
    {id:'G3',t:'All unused ports of DPT/PT/TT/RTD/FC properly plugged'},
    {id:'G4',t:'Alarms configured for min/max DP, P, and T — test alarm trip points'},

],
USM:[
  {sec:'A',title:'Meter Identification & Physical',items:[
    {id:'A1',t:'Make / Model / Serial No. of meter body'},{id:'A2',t:'Meter size (inches) and pressure rating'},
    {id:'A3',t:'Number of independent measurement paths'},{id:'A4',t:'Transducer make / model / serial nos. per path'},
    {id:'A5',t:'Flow conditioner / straightening vane installed (Yes/No/Type)'},{id:'A6',t:'Meter is AGA-9 / OIML R117 compliant'},
    {id:'A7',t:'Upstream straight run ≥ 10D confirmed'},{id:'A8',t:'Downstream straight run ≥ 5D confirmed'},
    {id:'A9',t:'By-pass available? If yes — positive isolation'},{id:'A10',t:'Operating velocity range: record min/max, confirm within spec'},
  ]},
  {sec:'B',title:'Transducer & Path Diagnostics',items:[
    {id:'B1',t:'Visual inspection of transducers — no damage, wear, or contamination'},
    {id:'B2',t:'Signal strength / SNR for each path (record per path)'},
    {id:'B3',t:'All measurement paths transmitting correctly (all paths active)'},
    {id:'B4',t:'SOS per path vs. AGA-10 expected value. Spread: < 0.5 m/s gas; < 2 m/s liquid'},
    {id:'B5',t:'Velocity profile check — velocity per path and profile correction factor'},
    {id:'B6',t:'Acoustic path integrity indicators / deviation flags — any active alarms?'},
    {id:'B7',t:'Diagnostic data downloaded and saved (velocity profile, SOS, gain, AGC)'},
    {id:'B8',t:'Spool / meter tube dimensions in FC match calibration certificate values'},
    {id:'B9',t:'Spool dimensions last verified (every 5 years or per GSA)'},
  ]},
  {sec:'C',title:'Secondary Instruments',items:[
    {id:'C1',t:'PT: Make / Model / Range / Cal. date'},{id:'C2',t:'TT / RTD: Make / Model / Wiring'},
    {id:'C3',t:'PT, TT calibrated — certificates available'},{id:'C4',t:'RTD/TT calibrated with temp bath — deviation < ±0.2°C'},

let state=defaultState();

// ── PERSISTENCE ─────────────────────────────────────────────────
function loadData(){
  try{const s=localStorage.getItem('ongc_v5');if(s){state=JSON.parse(s);
    if(!state.description.calSchedules)state.description.calSchedules={};
    if(!state.description.calTags)state.description.calTags={};
  }}catch(e){}
  METER_TYPES.forEach(t=>{if(!state.meters[t])state.meters[t]=[];if(state.activeMeters[t]===undefined)state.activeMeters[t]=0;});
  if(!state.assetData||!state.assetData.rows)state.assetData=defaultState().assetData;
}

function saveData(quiet){
  localStorage.setItem('ongc_v5',JSON.stringify(state));
  if(!quiet)showToast('✓ Saved to device');
}

function resetAll(){
  if(!confirm('Reset ALL data? This cannot be undone.'))return;
  localStorage.removeItem('ongc_v5');
  state=defaultState();
  METER_TYPES.forEach(t=>{state.meters[t]=[];state.activeMeters[t]=0;});
  activeMeterType='Orifice';
  navigate('cover');showToast('✓ All data reset');
}

// ── ROUTING ─────────────────────────────────────────────────────
function navigate(p){state.activePage=p;renderNav();renderPage();}

function renderNav(){
  document.getElementById('navTabs').innerHTML=PAGES.map(p=>
    `<div class="tab ${state.activePage===p.id?'active':''}" onclick="navigate('${p.id}')">${p.label}</div>`
  ).join('');
}

function renderPage(){
  const el=document.getElementById('mainContent');
  if(state.activePage==='cover')el.innerHTML=renderCover();
  else if(state.activePage==='data')el.innerHTML=renderAssetData();
  else if(state.activePage==='desc')el.innerHTML=renderDescription();
  else if(state.activePage==='meters')el.innerHTML=renderMetersPage();
  else if(state.activePage==='obs')el.innerHTML=renderObservations();
  attachListeners();
  if(state.activePage==='meters')setTimeout(()=>renderMTC(activeMeterType),0);
}

function rPS(title,path,rows,keys,labels){return`<div class="cs-section"><div class="ptitle">${title}</div>

function addPR(path,ks){const keys=ks.split(','),obj={};keys.forEach(k=>obj[k]='');
  const pts=path.split('.');let ref=state;for(let i=0;i<pts.length-1;i++)ref=ref[pts[i]];

      <td><input data-path="description.meterList[${i}].freq" value="${e(r.freq||'')}" placeholder="Frequency"></td>

            <td>${e(row.a)}</td><td>${e(row.s)}</td>
            ${tags.map((_,ti)=>{const k=`${sched.key}_${ri}_${ti}`,v=state.description.calSchedules[k]||'';
              return `<td><select onchange="setCS('${sched.key}',${ri},${ti},this.value)">${COMP.map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select></td>`;
            }).join('')}
          </tr>`).join('')}</tbody>
        </table></div>
      </div></div>`;

  // Summary
  const SR=[['custGas','Custody meter (Gas)'],['custOil','Custody meter (Oil)'],['custCon','Custody meter (Condensate/LPG/C2C3)'],['prodGas','Production meter (Gas)'],['prodOil','Production meter (Oil)'],['wb','Weighbridge']];

function addDR(){state.description.meterList.push({inst:'',desc:'',type:'',tag:'',service:'',purpose:'',lastCal:'',freq:'',remarks:''});renderPage();}
function addTag(key){if(!state.description.calTags[key])state.description.calTags[key]=['Meter Tag 1','Meter Tag 2','Meter Tag 3'];const n=state.description.calTags[key].length+1;state.description.calTags[key].push('Meter Tag '+n);saveData(true);renderPage();}
function removeTag(key,ti){if(!state.description.calTags[key])return;state.description.calTags[key].splice(ti,1);saveData(true);renderPage();}
function renameTag(key,ti,val){if(!state.description.calTags[key])return;state.description.calTags[key][ti]=val;saveData(true);// also update the table header live without full re-render
const tbl=document.querySelector(`#sched_${key} .st-table`);if(tbl){const ths=tbl.querySelectorAll('thead tr th');const tagIdx=2+ti;if(ths[tagIdx])ths[tagIdx].textContent=val||('Meter Tag '+(ti+1));}}
function setCS(key,ri,ti,val){state.description.calSchedules[`${key}_${ri}_${ti}`]=val;saveData(true);}

let activeMeterType='Orifice';

function renderMetersPage(){return`<div class="ptitle">Select Meter Type</div>
  <div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px">
    ${METER_TYPES.map(t=>`<button class="mt ${activeMeterType===t?'am':''}" onclick="switchMT('${t}')">
      ${t}${state.meters[t]&&state.meters[t].length?` <span style="background:var(--accent);color:var(--navy);border-radius:9px;padding:1px 5px;font-size:10px">${state.meters[t].length}</span>`:''}
    </button>`).join('')}
  </div>
  <div id="mtc"></div>`;}

function switchMT(type){activeMeterType=type;renderPage();}

function renderMTC(type){
  const el=document.getElementById('mtc');if(!el)return;
  const meters=state.meters[type]||[];
  if(!meters.length){el.innerHTML=`<div class="empty"><div class="icon">🔧</div>
    <p>No <strong>${type}</strong> meters added yet.<br>Tap below to add the first one.</p>
    <button class="add-m" style="margin-top:13px" onclick="addM('${type}')">+ Add ${type} Meter</button></div>`;return;}
  const idx=Math.min(state.activeMeters[type]||0,meters.length-1);
  state.activeMeters[type]=idx;
  const m=meters[idx];
  if(!m.data)m.data={};

  el.innerHTML=`<div class="mm">
    <div class="mm-title">${type} Meters</div>
    <div class="mt-wrap">
      ${meters.map((mx,i)=>`<div class="mt ${i===idx?'am':''}" onclick="selM('${type}',${i})">
        ${e(mx.label||type+' '+(i+1))}
        <button class="db" onclick="event.stopPropagation();delM('${type}',${i})">×</button>
      </div>`).join('')}
      <button class="add-m" onclick="addM('${type}')">+ Add</button>
    </div>
    <div class="mhf">
      <div><div class="fl">Meter Label / Tag</div><input class="ci" placeholder="e.g. FT-101" value="${e(m.label||'')}" oninput="setMF('${type}',${idx},'label',this.value)"></div>
      <div><div class="fl">Installation</div><input class="ci" placeholder="Installation" value="${e(m.header.inst||'')}" oninput="setMF('${type}',${idx},'inst',this.value)"></div>
      <div><div class="fl">Service</div><input class="ci" placeholder="Gas / Oil / Condensate" value="${e(m.header.svc||'')}" oninput="setMF('${type}',${idx},'svc',this.value)"></div>
      <div><div class="fl">Consumer</div><input class="ci" placeholder="Consumer" value="${e(m.header.consumer||'')}" oninput="setMF('${type}',${idx},'consumer',this.value)"></div>
      <div><div class="fl">Make / Model / Serial No.</div><input class="ci" placeholder="Make / Model / S/N" value="${e(m.header.make||'')}" oninput="setMF('${type}',${idx},'make',this.value)"></div>
      <div><div class="fl">Meter Size</div><input class="ci" placeholder='e.g. 4" / DN100' value="${e(m.header.size||'')}" oninput="setMF('${type}',${idx},'size',this.value)"></div>
    </div>
  </div>
  ${renderProg(type,idx)}
  ${renderCL(type,idx)}`;

  // *** ROOT FIX: attach listeners directly to the injected inputs ***
  el.querySelectorAll('[data-mtype]').forEach(inp=>{
    ['input','change'].forEach(evt=>inp.addEventListener(evt,ev=>{
      const {mtype,midx,cpid,field}=ev.target.dataset;
      const mx=state.meters[mtype][parseInt(midx)];
      if(!mx.data)mx.data={};
      if(!mx.data[cpid])mx.data[cpid]={val:'',rem:''};
      mx.data[cpid][field]=ev.target.value;
      saveData(true);
    }));
  });
}

function setMF(type,idx,field,val){
  const m=state.meters[type][idx];
  if(field==='label')m.label=val;else m.header[field]=val;
  saveData(true);
}

function renderProg(type,idx){
  const cl=CL[type]||[];const m=state.meters[type][idx];
  let total=0,filled=0;
  cl.forEach(sec=>sec.items.forEach(item=>{total++;const d=m.data&&m.data[item.id];if(d&&(d.val||d.rem))filled++;}));
  const pct=total?Math.round(filled/total*100):0;
  return`<div class="pw"><div class="pl"><span>Completion</span><span>${filled}/${total} checkpoints (${pct}%)</span></div>
    <div class="pb"><div class="pf" style="width:${pct}%"></div></div></div>`;}

function renderCL(type,idx){
  const sections=CL[type]||[];const m=state.meters[type][idx];if(!m.data)m.data={};
  return sections.map((sec,si)=>`
    <div class="sc ${si===0?'open':''}" id="sec_${type}_${idx}_${si}">
      <div class="sh" onclick="toggleSec('sec_${type}_${idx}_${si}')">
        <div><div class="sl">Section ${sec.sec}</div><div class="st">${sec.title}</div></div>
        <span class="sv">⌃</span>
      </div>
      <div class="sb">${sec.items.map(item=>{
        const d=m.data[item.id]||{val:'',rem:''};
        return`<div class="cp-row">
          <div><span class="cp-id">${item.id}</span><span class="cp-text"> ${item.t}</span></div>
          <div class="cp-grid">
            <div><div style="font-size:10px;color:var(--text2);margin-bottom:2px">Detail / Value</div>
              <input class="ci" placeholder="Enter value..." value="${e(d.val||'')}" data-mtype="${type}" data-midx="${idx}" data-cpid="${item.id}" data-field="val"></div>
            <div><div style="font-size:10px;color:var(--text2);margin-bottom:2px">Remarks</div>
              <input class="ci" placeholder="Remarks..." value="${e(d.rem||'')}" data-mtype="${type}" data-midx="${idx}" data-cpid="${item.id}" data-field="rem"></div>
          </div></div>`;}).join('')}
      </div></div>`).join('');}

function addM(type){
  if(!state.meters[type])state.meters[type]=[];
  const n=state.meters[type].length+1;
  state.meters[type].push({label:type+' '+n,header:{inst:'',svc:'',consumer:'',make:'',size:''},data:{}});
  state.activeMeters[type]=state.meters[type].length-1;
  saveData(true);renderPage();
}
function selM(type,idx){state.activeMeters[type]=idx;renderPage();}
function delM(type,idx){
  if(!confirm('Delete this meter and all its data?'))return;
  state.meters[type].splice(idx,1);
  state.activeMeters[type]=Math.max(0,(state.activeMeters[type]||0)-1);
  saveData(true);renderPage();
}
function toggleSec(id){const el=document.getElementById(id);if(el)el.classList.toggle('open');}

function attachListeners(){
  document.querySelectorAll('[data-path]').forEach(el=>{
    const evt=el.tagName==='SELECT'||el.type==='date'?'change':'input';
    el.addEventListener(evt,ev=>{setPath(state,ev.target.dataset.path,ev.target.value);saveData(true);});
  });
}

function setPath(obj,path,value){
  const pts=path.replace(/\[(\d+)\]/g,'.$1').split('.');let ref=obj;
  for(let i=0;i<pts.length-1;i++){if(ref[pts[i]]===undefined)ref[pts[i]]={};ref=ref[pts[i]];}
  ref[pts[pts.length-1]]=value;
}

function e(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

    ...state.observations.map((o,i)=>[i+1,o.tag,o.obs,o.cat,o.priority,o.action,o.workcentre]),
  ]),'Observations & ATR');
  const SN={Orifice:'Orifice Meter',USM:'USM',MFM:'MFM',TFM:'Turbine Flow Meter (TFM)',Flare:'Flare Meter',GC:'Gas Chromatograph (GC)',Weighbridge:'Weighbridge'};
  METER_TYPES.forEach(type=>{
    const meters=state.meters[type]||[];if(!meters.length)return;
    const cl=CL[type]||[];const aoa=[[`FLOW METER AUDIT CHECKLIST | ${type.toUpperCase()}`]];
    meters.forEach((m,mi)=>{
      aoa.push([''],['--- METER '+(mi+1)+': '+(m.label||type+' '+(mi+1))+' ---']);
      aoa.push(['Installation',m.header.inst],['Service',m.header.svc],['Consumer',m.header.consumer],['Make / Model / Serial No.',m.header.make],['Meter Size',m.header.size],['']);
      aoa.push(['SN','Checkpoint / Audit Criteria','Detail / Value','Remarks']);
      cl.forEach(sec=>{aoa.push([sec.sec+'.  '+sec.title]);sec.items.forEach(item=>{const d=(m.data&&m.data[item.id])||{};aoa.push([item.id,item.t,d.val||'',d.rem||'']);});});
    });
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),SN[type].substring(0,31));
  });
  XLSX.writeFile(wb,`ONGC_FlowMeter_Audit_${new Date().toISOString().slice(0,10)}.xlsx`);
  showToast('✓ Excel exported!');
}


// ── EXCEL IMPORT ─────────────────────────────────────────────────

// ── EXCEL IMPORT ─────────────────────────────────────────────────
function triggerImport(){document.getElementById('importFile').value='';document.getElementById('importFile').click();}
function closeImportModal(){document.getElementById('importModal').style.display='none';}

function importXLSX(files){
  if(!files||!files.length)return;
  const log=[];
  let pending=files.length;
  Array.from(files).forEach(file=>{
    const reader=new FileReader();
    reader.onload=function(ev){
      try{
        const wb=XLSX.read(ev.target.result,{type:'array',cellDates:false});
        log.push(...processWorkbook(wb,file.name));
      }catch(err){log.push(`<span class="err">✗ ${file.name}: ${err.message}</span>`);}
      pending--;
      if(pending===0){saveData(true);renderPage();showImportModal(log);}
    };
    reader.readAsArrayBuffer(file);
  });
}

function showImportModal(log){
  document.getElementById('importLog').innerHTML=log.join('\n')||'<span class="warn">Nothing imported.</span>';
  document.getElementById('importModal').style.display='flex';
}

function sheetRows(wb,name){
  const sh=wb.Sheets[name];if(!sh)return null;
  return XLSX.utils.sheet_to_json(sh,{header:1,defval:'',raw:true});
}

function cv(v){
  if(v===null||v===undefined)return'';
  return String(v).trim();
}

// ── Robust date formatter ──────────────────────────────────────
function fmtDate(v){
  if(!v&&v!==0)return'';
  // Excel serial number (number type)
  if(typeof v==='number'){
    // Excel date serial: days since 1900-01-01 (with Lotus 1900 bug: serial 60 = fake 29-Feb-1900)
    const d=new Date(Math.round((v-25569)*86400*1000));
    if(!isNaN(d.getTime()))return d.toISOString().slice(0,10);
  }
  const s=String(v).trim();
  if(!s)return'';
  // Already yyyy-mm-dd
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  // dd.mm.yyyy  (e.g. 19.01.2026)
  const m1=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if(m1)return`${m1[3]}-${m1[2].padStart(2,'0')}-${m1[1].padStart(2,'0')}`;
  // dd-mm-yyyy or dd/mm/yyyy
  const m2=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m2)return`${m2[3]}-${m2[2].padStart(2,'0')}-${m2[1].padStart(2,'0')}`;
  // yyyy/mm/dd
  const m3=s.match(/^(\d{4})[\/\-](\d{2})[\/\-](\d{2})$/);
  if(m3)return`${m3[1]}-${m3[2]}-${m3[3]}`;
  // dd mmm yyyy (e.g. 19 Jan 2026)
  const months={jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12'};
  const m4=s.match(/^(\d{1,2})\s+([a-zA-Z]{3})\s+(\d{4})$/);
  if(m4&&months[m4[2].toLowerCase()])return`${m4[3]}-${months[m4[2].toLowerCase()]}-${m4[1].padStart(2,'0')}`;
  return s;
}

// ── Fuzzy meter type detection from sheet name or cell value ──
function detectMeterType(sn){
  const s=sn.toLowerCase().replace(/[^a-z0-9\s]/g,' ');
  if(s.includes('orifice'))return'Orifice';
  if(s.includes('usm')||s.includes('ultrasonic'))return'USM';
  if(s.includes('mfm')||s.includes('coriolis'))return'MFM';
  if(s.includes('turbine')||s.includes('tfm'))return'TFM';
  if(s.includes('flare'))return'Flare';
  if(s.includes('gc')||s.includes('gas chromatograph'))return'GC';
  if(s.includes('weighbridge'))return'Weighbridge';
  return null;
}

// ── Map Excel "Type of Meter" text to CAL_SCHEDULES key ───────
function detectCalSchedKey(typeText){
  const s=typeText.toLowerCase().trim();
  if(s.includes('orifice'))return'orifice';
  if(s.includes('usm')||s.includes('ultrasonic'))return'usm';
  if(s.includes('mfm')||s.includes('coriolis'))return'mfm';
  if(s.includes('turbine')||s.includes('tfm'))return'tfm';
  if(s.includes('flare'))return'flare';
  if(s.includes('gc')||s.includes('chromatograph'))return'gc';
  if(s.includes('weighbridge'))return'weighbridge';
  if(s.includes('flow computer')||s==='fc')return'fc';
  if(s.includes('metering system')||s==='ms')return'ms';
  return null;
}

// ── Fuzzy match activity text to sched.rows index ────────────
function matchActivity(actText,schedRows){
  const a=actText.toLowerCase().replace(/\s+/g,' ').trim();
  // exact
  let idx=schedRows.findIndex(r=>r.a.toLowerCase()===a);
  if(idx>=0)return idx;
  // partial: activity contains sched text or vice versa
  idx=schedRows.findIndex(r=>a.includes(r.a.toLowerCase().slice(0,12))||r.a.toLowerCase().includes(a.slice(0,12)));
  return idx;
}

// ── processWorkbook ───────────────────────────────────────────
function processWorkbook(wb,fname){
  const log=[`<span class="ok">📄 ${fname}</span>`];
  wb.SheetNames.forEach(sn=>{
    const rows=sheetRows(wb,sn);
    if(!rows||!rows.length)return;
    if(sn==='Cover'||sn==='Cover Letter'){importCoverSheet(rows,sn,log);}
    else if(sn==='Data'){importDataSheet(rows,log);}
    else if(sn==='Description'){importDescriptionSheet(rows,log);}
    else if(sn.toLowerCase().includes('observation')){importObservationsSheet(rows,log);}
    else{
      const mtype=detectMeterType(sn);
      if(mtype){importMeterSheet(rows,sn,mtype,log);}
      else{log.push(`  <span class="warn">  ⚠ Skipped sheet: "${sn}" (unrecognised type)</span>`);}
    }
  });
  return log;
}

// ── Cover sheet ───────────────────────────────────────────────
function importCoverSheet(rows,sn,log){
  let imp=0;const c=state.cover;
  rows.forEach(row=>{
    const k=cv(row[0]).toLowerCase(),v=cv(row[1]);if(!v)return;
    if(k.includes('document no')||k.includes('report no')){c.reportNo=v;imp++;}
    else if(k.includes('date of audit')){c.dateAudit=fmtDate(v);imp++;}
    else if(k.includes('date of report')){c.dateReport=fmtDate(v);imp++;}
    else if(k.includes('installation')){c.installations=v;imp++;}
  });
  let mode=null;
  rows.forEach(row=>{
    const k=(cv(row[0])+cv(row[1])).toUpperCase();
    if(k.includes('AUDITOR')){mode='auditors';c.auditors=[];}
    else if(k.includes('ASSET I/C TA')){mode='icea';c.icea=[];}
    else if(k.includes('ASSET I/C INST')){mode='icei';c.icei=[];}
    else if(k.includes('INSTALLATION REP')){mode='instReps';c.instReps=[];}
    else if(mode){
      const sl=parseInt(cv(row[0]));if(isNaN(sl)||sl<1)return;
      if(mode==='instReps')c[mode].push({inst:cv(row[1]),name:cv(row[2]),desig:cv(row[3]),cpf:cv(row[4])});
      else c[mode].push({name:cv(row[1]),desig:cv(row[2]),cpf:cv(row[3]),contact:cv(row[4])});
      imp++;
    }
  });
  log.push(`  <span class="ok">  ✓ ${sn}: ${imp} fields</span>`);
}

// ── Data sheet ────────────────────────────────────────────────
function importDataSheet(rows,log){
  // Header row has "Description" somewhere in col 1 or 0; data starts after
  let start=-1,imp=0;
  for(let i=0;i<rows.length;i++){
    const r0=cv(rows[i][0]).toLowerCase(),r1=cv(rows[i][1]).toLowerCase();
    if(r0.includes('description')||r1.includes('description')){start=i+1;break;}
  }
  if(start<0){log.push('  <span class="warn">  ⚠ Data: header not found</span>');return;}
  const newRows=[];
  for(let i=start;i<rows.length;i++){
    // data may be in col 0 or col 1 depending on template
    let d=cv(rows[i][1])||cv(rows[i][0]);
    let v=cv(rows[i][2]);
    let u=cv(rows[i][3]);
    if(!d)continue;
    newRows.push({desc:d,value:v,unit:u});imp++;
  }
  if(newRows.length)state.assetData.rows=newRows;
  log.push(`  <span class="ok">  ✓ Data: ${imp} rows</span>`);
}

// ── Description sheet ─────────────────────────────────────────
function importDescriptionSheet(rows,log){
  const ds=state.description;
  let imp=0;
  // ── Part 1: Flow Meter Details table ──
  // Find header row (contains "SN" and "Installation")
  let meterStart=-1;
  for(let i=0;i<rows.length;i++){
    const r=rows[i];
    if(cv(r[0]).toUpperCase()==='SN'&&cv(r[1]).toUpperCase().includes('INSTALL')){meterStart=i+1;break;}
  }
  if(meterStart>=0){
    ds.meterList=[];
    for(let i=meterStart;i<rows.length;i++){
      const r=rows[i];
      const sn=parseInt(cv(r[0]));if(isNaN(sn)||sn<1)break;
      // cols: 0=SN,1=Installation,2=Description,3=MeterType,4=Tag,5=Service,6=Purpose,7=LastCal,8=CalFreq,9+=extra
      const lastCal=fmtDate(cv(r[7]));
      ds.meterList.push({
        inst:cv(r[1]),desc:cv(r[2]),type:cv(r[3]),tag:cv(r[4]),
        service:cv(r[5]),purpose:cv(r[6]),lastCal:lastCal,
        freq:cv(r[8]),remarks:cv(r[9])||''
      });
      imp++;
    }
    log.push(`  <span class="ok">  ✓ Meter list: ${ds.meterList.length} rows (dates parsed)</span>`);
  }

  // ── Part 2: Calibration Schedule tables ──
  // Each cal schedule block starts with a row where col0="Type of Meter" / col1="Activity" / col2="Schedule"
  // Data rows: col0=type(or blank), col1=activity, col2=schedule, col3+=compliance per tag
  let calImp=0;
  let i=0;
  while(i<rows.length){
    const r=rows[i];
    const h0=cv(r[0]).toLowerCase(),h1=cv(r[1]).toLowerCase(),h2=cv(r[2]).toLowerCase();
    // Detect header row of a cal schedule block
    if((h0.includes('type of meter')||h0.includes('type'))&&h1.includes('activity')&&h2.includes('schedule')){
      // tags start at col 3
      const tags=[];
      for(let t=3;t<r.length;t++){const tg=cv(r[t]);if(tg&&!tg.toLowerCase().includes('meter tag')||tg.length>8)tags.push(tg);else if(tg)tags.push(tg);}
      // Only keep non-empty tags (filter trailing empties)
      const cleanTags=[];for(let t=3;t<r.length;t++){const tg=cv(r[t]);if(tg)cleanTags.push(tg);}

      let currentKey=null;
      let dataRow=i+1;
      while(dataRow<rows.length){
        const dr=rows[dataRow];
        const d0=cv(dr[0]),d1=cv(dr[1]),d2=cv(dr[2]);
        // Next block header or empty section break
        if(cv(dr[0]).toLowerCase().includes('type of meter')&&cv(dr[1]).toLowerCase().includes('activity'))break;
        if(!d1&&!d0){dataRow++;continue;}
        // Update current meter type if col0 is filled
        if(d0)currentKey=detectCalSchedKey(d0)||currentKey;
        if(!currentKey){dataRow++;continue;}
        const sched=CAL_SCHEDULES.find(s=>s.key===currentKey);
        if(!sched){dataRow++;continue;}
        // Store tags for this schedule
        if(cleanTags.length)ds.calTags[currentKey]=cleanTags;
        // Match activity to schedule row
        const actIdx=matchActivity(d1,sched.rows);
        if(actIdx>=0){
          cleanTags.forEach((_,ti)=>{
            const val=cv(dr[3+ti]);
            if(val&&COMP.includes(val)){ds.calSchedules[`${currentKey}_${actIdx}_${ti}`]=val;calImp++;}
          });
        }
        dataRow++;
      }
      i=dataRow;
    } else {i++;}
  }
  log.push(`  <span class="ok">  ✓ Cal schedules: ${calImp} compliance entries</span>`);

  // ── Part 3: Summary rows ──
  const SR=[['custGas','custody meter (gas)'],['custOil','custody meter (oil)'],['custCon','custody meter (condensate'],['prodGas','production meter (gas)'],['prodOil','production meter (oil)'],['wb','weighbridge']];
  rows.forEach(row=>{
    const sn=parseInt(cv(row[0]));if(isNaN(sn)||sn<1||sn>6)return;
    const label=cv(row[1]).toLowerCase();
    const match=SR.find(([,l])=>label.includes(l.split('(')[0].trim()));
    if(!match)return;
    const key=match[0];
    ['T','W','NW','C','NC'].forEach((sf,j)=>{const v=cv(row[j+2]);if(v){ds.summary[key+sf]=v;imp++;}});
  });

  imp+=calImp;
  log.push(`  <span class="ok">  ✓ Description total: ${imp} items imported</span>`);
}

// ── Observations sheet ────────────────────────────────────────
function importObservationsSheet(rows,log){
  let start=-1,imp=0;
  for(let i=0;i<rows.length;i++){
    const h=cv(rows[i][0]).toUpperCase();
    if(h.includes('SL')||h.includes('OBSERVATION')){
      if(cv(rows[i][1]).toLowerCase().includes('tag')||cv(rows[i][2]).toLowerCase().includes('obs'))
        {start=i+1;break;}
    }
  }
  if(start<0){log.push('  <span class="warn">  ⚠ Observations: header not found</span>');return;}
  for(let i=start;i<rows.length;i++){
    const sn=parseInt(cv(rows[i][0]));if(isNaN(sn)||sn<1)continue;
    const tag=cv(rows[i][1]),obs=cv(rows[i][2]),cat=cv(rows[i][3]),pri=cv(rows[i][4]),act=cv(rows[i][5]),wc=cv(rows[i][6]);
    if(!obs&&!tag)continue;
    const exists=state.observations.find(o=>o.tag===tag&&o.obs===obs);
    if(!exists)state.observations.push({tag,obs,cat:OBS_CAT.includes(cat)?cat:'',priority:OBS_PRI.includes(pri)?pri:'',action:act,workcentre:wc});
    imp++;
  }
  log.push(`  <span class="ok">  ✓ Observations: ${imp} rows</span>`);
}

// ── Meter checklist sheet (multi-meter side-by-side columns) ──
function importMeterSheet(rows,sn,mtype,log){
  if(!state.meters[mtype])state.meters[mtype]=[];
  const cl=CL[mtype]||[];
  // Build checkpoint id lookup
  const cpMap={};cl.forEach(sec=>sec.items.forEach(item=>cpMap[item.id]=true));

  // Find the data header row: col0="SN", col1 contains "Checkpoint"
  let headerRow=-1;
  for(let i=0;i<rows.length;i++){
    if(cv(rows[i][0]).toUpperCase()==='SN'&&cv(rows[i][1]).toLowerCase().includes('check')){headerRow=i;break;}
  }
  if(headerRow<0){log.push(`  <span class="warn">  ⚠ ${sn}: checkpoint header not found</span>`);return;}

  // Count meters from header row: cols 2,4,6... = Detail/Value columns
  // But first get tags from row where col0="Tag No."
  const tagRow=rows.findIndex(r=>cv(r[0]).toLowerCase().includes('tag no'));
  const meterCount=Math.floor((rows[headerRow].length-2)/2)||1;
  const meters=[];
  for(let mi=0;mi<meterCount;mi++){
    const valCol=2+mi*2;
    const remCol=3+mi*2;
    // Get tag from tagRow
    let tag='';
    if(tagRow>=0){tag=cv(rows[tagRow][valCol]);}
    if(!tag||tag.toLowerCase().startsWith('meter'))tag=mtype+' '+(mi+1);
    const m={label:tag,header:{inst:'',svc:'',consumer:'',make:'',size:''},data:{}};
    // Read header fields from rows before headerRow
    for(let r=0;r<headerRow;r++){
      const k=cv(rows[r][0]).toLowerCase();
      const v=cv(rows[r][valCol]);
      if(!v)continue;
      if(k.includes('installation'))m.header.inst=v;
      else if(k.includes('service'))m.header.svc=v;
      else if(k.includes('consumer'))m.header.consumer=v;
      else if(k.includes('make')||k.includes('model'))m.header.make=v;
      else if(k.includes('meter size')||k==='size')m.header.size=v;
    }
    meters.push({m,valCol,remCol});
  }

  // Read checkpoint rows
  let imp=0;
  for(let r=headerRow+1;r<rows.length;r++){
    const id=cv(rows[r][0]);
    if(!id||!cpMap[id])continue;
    meters.forEach(({m,valCol,remCol})=>{
      const val=cv(rows[r][valCol]);
      const rem=cv(rows[r][remCol]);
      if(val||rem){
        if(!m.data[id])m.data[id]={val:'',rem:''};
        if(val)m.data[id].val=val;
        if(rem)m.data[id].rem=rem;
        imp++;
      }
    });
  }

  // Merge: if meter with same tag already exists, update it; else push new
  meters.forEach(({m})=>{
    const existing=state.meters[mtype].find(x=>x.label===m.label);
    if(existing){Object.assign(existing.header,m.header);Object.assign(existing.data,m.data);}
    else{state.meters[mtype].push(m);state.activeMeters[mtype]=state.meters[mtype].length-1;}
  });

  log.push(`  <span class="ok">  ✓ ${sn} (${mtype}): ${meters.length} meter(s), ${imp} checkpoint fields</span>`);
}
