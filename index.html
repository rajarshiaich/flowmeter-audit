<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FM Audit">
<meta name="theme-color" content="#0a1628">
<title>ONGC Flow Meter Audit</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--navy:#0a1628;--navy2:#112240;--navy3:#1a3a5c;--accent:#f5a623;--green:#2ecc71;--red:#e74c3c;--blue:#3b82f6;--text:#e8edf4;--text2:#8899aa;--border:rgba(255,255,255,.1);--card:rgba(255,255,255,.04);--r:10px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--navy);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
/* HEADER */
.hdr{background:var(--navy2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;padding:0 12px}
.hdr-top{display:flex;align-items:center;justify-content:space-between;height:52px;gap:8px}
.logo{display:flex;align-items:center;gap:7px;flex-shrink:0}
.badge{background:var(--accent);color:var(--navy);font-weight:800;font-size:10px;padding:3px 6px;border-radius:4px}
.logo-text{font-size:13px;font-weight:600}
.logo-sub{font-size:9px;color:var(--text2);margin-top:1px}
.hbtns{display:flex;gap:4px;flex-wrap:nowrap}
.btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:5px 9px;border-radius:7px;font-size:11px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:3px}
.btn:active{opacity:.7}
.btn-x{background:var(--accent);border-color:var(--accent);color:var(--navy);font-weight:700}
.btn-r{background:rgba(231,76,60,.1);border-color:var(--red);color:var(--red)}
.btn-i{background:rgba(59,130,246,.15);border-color:var(--blue);color:#60a5fa}
/* INSTALL BANNER */
.install-banner{background:linear-gradient(90deg,rgba(59,130,246,.2),rgba(245,166,35,.15));border-bottom:1px solid rgba(59,130,246,.3);padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.install-banner p{font-size:11px;color:var(--text);flex:1}
.install-banner p strong{color:var(--accent)}
.btn-install{background:var(--blue);border:none;color:#fff;padding:5px 12px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-banner-close{background:none;border:none;color:var(--text2);font-size:16px;cursor:pointer;padding:0 4px}
/* NAV */
.nav{display:flex;overflow-x:auto;gap:3px;padding:6px 0;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:5px 12px;border-radius:20px;font-size:11px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text2)}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--navy);font-weight:700}
/* MAIN */
.main{padding:12px;max-width:820px;margin:0 auto;padding-bottom:40px}
.ptitle{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:10px;text-transform:uppercase;letter-spacing:.7px}
/* CARDS */
.sc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:9px;overflow:hidden}
.sh{padding:10px 12px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none}
.sl{font-size:10px;font-weight:700;color:var(--accent);letter-spacing:.6px;text-transform:uppercase}
.st{font-size:13px;font-weight:600;margin-top:1px}
.sv{color:var(--text2);font-size:14px;transition:transform .2s;margin-left:6px}
.sc.open .sv{transform:rotate(180deg)}
.sb{display:none;padding:0 10px 10px}
.sc.open .sb{display:block}
/* FIELDS */
.fl{font-size:10px;color:var(--text2);margin-bottom:3px;text-transform:uppercase;letter-spacing:.4px}
.fi{width:100%;background:var(--navy2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;padding:7px 10px;outline:none;-webkit-appearance:none}
.fi:focus{border-color:var(--accent)}
.fi::placeholder{color:var(--text2)}
textarea.fi{resize:vertical;min-height:50px;font-family:inherit}
select.fi{cursor:pointer}
select.fi option{background:var(--navy2)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px}
/* CHECKPOINTS */
.cp-row{border-top:1px solid var(--border);padding:8px 0}
.cp-row:first-child{border-top:none}
.cp-id{font-size:10px;font-weight:700;color:var(--accent);min-width:24px;display:inline-block}
.cp-txt{font-size:12px;line-height:1.4;margin-bottom:6px}
.cp-g{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ci{width:100%;background:var(--navy2);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:12px;padding:5px 8px;outline:none;-webkit-appearance:none}
.ci:focus{border-color:var(--accent)}
.ci::placeholder{color:rgba(136,153,170,.5)}
/* METER MANAGER */
.mm{background:var(--navy2);border:1px solid var(--border);border-radius:var(--r);padding:11px;margin-bottom:12px}
.mm-t{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px}
.mt-wrap{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.mt{padding:4px 11px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text2);position:relative}
.mt.am{background:var(--navy3);border-color:var(--accent);color:var(--text)}
.mt .db{position:absolute;top:-4px;right:-4px;background:var(--red);border:none;color:#fff;border-radius:50%;width:14px;height:14px;font-size:9px;display:none;align-items:center;justify-content:center;cursor:pointer}
.mt:hover .db{display:flex}
.add-m{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px dashed var(--accent);background:transparent;color:var(--accent)}
.mhf{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
/* TABLES */
.dt{width:100%;border-collapse:collapse;font-size:11px}
.dt th{background:var(--navy3);color:var(--text2);font-size:10px;text-transform:uppercase;letter-spacing:.4px;padding:6px 6px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
.dt td{padding:4px 4px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
.dt td input,.dt td select{width:100%;background:transparent;border:none;color:var(--text);font-size:11px;outline:none;padding:2px 2px;-webkit-appearance:none;min-width:55px}
.dt td:focus-within{background:rgba(245,166,35,.07)}
.add-row{width:100%;padding:6px;border:1px dashed var(--border);background:transparent;color:var(--text2);font-size:11px;border-radius:5px;cursor:pointer;margin-top:5px}
/* SCHEDULE TABLE */
.sch-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.sch{width:100%;border-collapse:collapse;font-size:11px;min-width:400px}
.sch th{background:var(--navy3);color:var(--text2);font-size:10px;text-transform:uppercase;letter-spacing:.4px;padding:6px 6px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
.sch td{padding:5px 5px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle;color:var(--text)}
.sch td:nth-child(2){color:var(--text2);font-size:10px;font-style:italic}
/* Editable tag header cell */
.tag-th{background:var(--navy3);padding:4px 3px}
.tag-th input{width:100%;background:rgba(245,166,35,.12);border:1px solid rgba(245,166,35,.3);border-radius:4px;color:var(--accent);font-size:10px;font-weight:700;padding:2px 4px;outline:none;text-align:center;min-width:60px}
.tag-th input:focus{border-color:var(--accent);background:rgba(245,166,35,.2)}
.sch td select{width:100%;background:var(--navy2);border:1px solid var(--border);color:var(--text);font-size:11px;padding:3px 4px;border-radius:4px;outline:none;cursor:pointer;-webkit-appearance:none;min-width:90px}
.sch td select option{background:var(--navy2)}
.add-tag-btn{padding:3px 9px;border-radius:11px;font-size:10px;font-weight:600;cursor:pointer;border:1px dashed rgba(245,166,35,.5);background:transparent;color:var(--accent);margin-left:4px}
/* OBS */
.obs-row{background:var(--navy2);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:9px;position:relative}
.obs-del{position:absolute;top:6px;right:6px;background:transparent;border:none;color:var(--red);cursor:pointer;font-size:15px}
.og{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.add-obs{width:100%;padding:8px;border:1px dashed var(--accent);background:transparent;color:var(--accent);font-size:12px;font-weight:600;border-radius:7px;cursor:pointer;margin-top:8px}
/* PROGRESS */
.pw{margin-bottom:12px}
.pl{display:flex;justify-content:space-between;font-size:10px;color:var(--text2);margin-bottom:3px}
.pb{height:3px;background:var(--border);border-radius:2px}
.pf{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
/* IMPORT */
.imp-zone{border:2px dashed var(--border);border-radius:var(--r);padding:20px;text-align:center;cursor:pointer;transition:border-color .2s;margin-bottom:12px;position:relative}
.imp-zone:hover,.imp-zone.drag{border-color:var(--accent);background:rgba(245,166,35,.04)}
.imp-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.imp-zone .icon{font-size:30px;margin-bottom:6px}
.imp-zone p{font-size:12px;color:var(--text2)}
.imp-zone p strong{color:var(--text)}
.imp-log{background:var(--navy2);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:11px;color:var(--text2);max-height:200px;overflow-y:auto;font-family:monospace;line-height:1.6}
.imp-log .ok{color:var(--green)}
.imp-log .warn{color:var(--accent)}
.imp-log .err{color:var(--red)}
/* EMPTY */
.empty{text-align:center;padding:32px 16px;color:var(--text2)}
.empty .icon{font-size:34px;margin-bottom:7px}
.empty p{font-size:12px}
/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:8px 18px;border-radius:20px;font-size:12px;font-weight:600;z-index:9999;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap}
.toast.show{opacity:1}
@media(max-width:440px){.cp-g,.mhf,.frow,.og{grid-template-columns:1fr}.hbtns .btn{padding:4px 6px;font-size:10px}}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-top">
    <div class="logo">
      <span class="badge">ONGC</span>
      <div><div class="logo-text">Flow Meter Audit</div><div class="logo-sub">Offline Field Checklist</div></div>
    </div>
    <div class="hbtns">
      <button class="btn btn-i" onclick="navigate('import')" title="Import Excel">📥 Import</button>
      <button class="btn" onclick="saveData()">💾</button>
      <button class="btn btn-r" onclick="resetAll()" title="Reset all data">🗑</button>
      <button class="btn btn-x" onclick="exportXLSX()">⬇ Export</button>
    </div>
  </div>
  <div id="installBanner" style="display:none" class="install-banner">
    <p>📱 <strong>Install as app:</strong> Add to home screen for offline use</p>
    <button class="btn-install" id="installBtn" onclick="doInstall()">Install</button>
    <button class="btn-banner-close" onclick="closeBanner()">×</button>
  </div>
  <div class="nav" id="navTabs"></div>
</div>
<div class="main" id="mainContent"></div>
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════
const METER_TYPES=['Orifice','USM','MFM','TFM','Flare','GC','Weighbridge'];
const PAGES=[
  {id:'cover',label:'📋 Cover'},
  {id:'data',label:'📊 Asset Data'},
  {id:'desc',label:'🗂 Description'},
  {id:'meters',label:'⚙ Meters'},
  {id:'obs',label:'⚠ Observations'},
  {id:'import',label:'📥 Import'},
];
const OBS_CAT=['','Construction Deficiency','System Issue','Configuration Error','Calibration Gap','Maintenance Lapse','Security Concern','Upstream Process Issue','Documentation Gap'];
const OBS_PRI=['','NC - Critical','NC - High','NC - Moderate'];
const COMP=['','Complied','Not Complied','N/A'];

// Sheet name → meter type mapping for Excel import
const SHEET_TO_TYPE={
  'orifice meter':'Orifice','orifice':'Orifice',
  'usm':'USM','ultrasonic':'USM',
  'mfm':'MFM','coriolis':'MFM',
  'turbine flow meter (tfm)':'TFM','turbine flow meter':'TFM','tfm':'TFM','turbine':'TFM',
  'flare meter':'Flare','flare':'Flare',
  'gas chromatograph (gc)':'GC','gas chromatograph':'GC','gc':'GC',
  'weighbridge':'Weighbridge',
};

// Calibration schedule tables
const CAL_SCHEDULES=[
  {label:'Orifice Meter',key:'orifice',rows:[
    {a:'Calibration of DPT',s:'Every 3 months or GSA, whichever is lower'},
    {a:'Calibration of PT',s:'Every 3 months or GSA, whichever is lower'},
    {a:'Calibration of TT',s:'Every 3 months or GSA, whichever is lower'},
    {a:'Calibration of RTD',s:'Every Year'},
    {a:'Meter Tube Inspection',s:'Every Year'},
  ]},
  {label:'USM',key:'usm',rows:[

    {a:'Calibration of PT',s:'Every 6 months or GSA/COSA, whichever is lower'},
    {a:'Calibration of TT',s:'Every 6 months or GSA/COSA, whichever is lower'},
    {a:'Calibration of RTD',s:'Every Year'},
    {a:'Meter Calibration',s:'Every 5 years or GSA/COSA, whichever is lower'},
  ]},
  {label:'MFM (Coriolis)',key:'mfm',rows:[
    {a:'Diagnostic and Zero Check',s:'Every 6 months'},
    {a:'Calibration of PT',s:'Every 6 months or GSA/COSA, whichever is lower'},
    {a:'Calibration of TT',s:'Every 6 months or GSA/COSA, whichever is lower'},

  {label:'Turbine Meter (TFM)',key:'tfm',rows:[

  {label:'Flow Computer',key:'fc',tagLabel:'FC Tag',rows:[

  ]},
  {label:'Metering System',key:'ms',rows:[
    {a:'Validation by FCRI / BV / SGS etc.',s:'Any change in system configuration'},
  ]},
];

// ── FULL CHECKLISTS ──────────────────────────────────────────
const CL={
Orifice:[
  {sec:'A',title:'Primary Element — Orifice Plate & Meter Run',items:[
    {id:'A1',t:'Make / Model / Serial No. of primary device (orifice plate)'},
    {id:'A2',t:'Bore diameter d (mm) — as per AGA-3 certified report'},
    {id:'A3',t:'Pipe inside diameter D (mm) — as per AGA-3 certified report'},
    {id:'A4',t:'Beta ratio (d/D) — confirm within AGA-3 limits (0.3–0.75)'},
    {id:'A5',t:'Orifice plate type: Single-chamber / Senior / Simplex / Dual-chamber'},

    {id:'A10',t:'Frequency of meter run validation per GSA (every 2 years)'},
    {id:'A11',t:'Upstream straight run available ≥10D (confirm D value used)'},
    {id:'A12',t:'Downstream straight run available ≥5D'},
    {id:'A13',t:'Temperature tapping — confirm downstream of orifice within 4D'},
    {id:'A14',t:'Static pressure tapping: Upstream / Downstream / Flange / Pipe'},

    {id:'A17',t:'By-pass available? Positive isolation (double-block-and-bleed or blind)?'},
    {id:'A18',t:'Standby / duty philosophy (Single / 1W+1S / Other)'},
    {id:'A19',t:'Meter run serial no. matching AGA-3 certified report (Yes/No)'},
    {id:'A20',t:'Orifice plate last physical inspection date and bore measurement recorded'},
    {id:'A21',t:'Orifice plate condition: clean / fouled / damaged'},
    {id:'A22',t:'All unused ports / isolation valves properly blinded'},
    {id:'A23',t:'Upstream scrubber / separator available and LCV in auto mode'},
    {id:'A24',t:'Filtration unit / coalescing filter installed upstream of orifice'},
    {id:'A25',t:'Operating DP: What % of calibrated DP span? Target: 40–60% of span'},
  ]},
  {sec:'B',title:'Secondary Instruments',items:[
    {id:'B1',t:'DPT / MVT: Make / Model / Range / Serial No.'},
    {id:'B2',t:'DPT calibration span optimised so operating DP = 40–60% of span'},
    {id:'B3',t:'PT (Static pressure transmitter): Make / Model / Range'},

  {sec:'D',title:'Flow Computer Configuration',items:[

    {id:'D6',t:'Contract hour (06:00 hrs) entered correctly'},
    {id:'D7',t:'Orifice bore d, pipe bore D, material, expansion coefficients per AGA-3'},

    {id:'D14',t:'Gas analysis update frequency: fortnightly (1st and 16th) per GSA'},

  {sec:'E',title:'Calibration & Validation',items:[
    {id:'E1',t:'Present calibration frequency being followed (monthly / quarterly / as per GSA)'},
    {id:'E2',t:'Calibration frequency matches GSA requirement'},
    {id:'E3',t:'Unmeasured gas/fluid during calibration process quantified and stated in report'},
    {id:'E4',t:'Seal nos. (as-found AND as-left) documented in calibration report'},
    {id:'E5',t:'SAP t-code ZPMCALIB used for generating calibration record'},
    {id:'E6',t:'FC validation with (Kelton/equivalent) software. Zair, Zb, Zf documented.'},
    {id:'E7',t:'Local atmospheric pressure report available and updated at each calibration'},
    {id:'E8',t:'Master calibration instruments (DPT, PT, TT) calibrated from NABL lab (ISO 17025)'},
    {id:'E9',t:'Last joint meter run validation report available (Third Party / GAIL / Consumer)'},
    {id:'E10',t:'Last orifice plate change / re-certification report (if applicable)'},
    {id:'E11',t:'Flow computer validation (3rd party) record — every year'},
  ]},
  {sec:'F',title:'Documentation & SOP',items:[
    {id:'F1',t:'Approved SOP for CTM calibration available at plant and followed'},
    {id:'F2',t:'Approved SOP for CTM maintenance available at plant'},
    {id:'F3',t:'GSA / COSA document available at installation (not only at head office)'},
    {id:'F4',t:'CTM spares (DPT, PT, RTD, manifold valves, orifice plate) available on site'},
    {id:'F5',t:'Existing FC model is within OEM active lifecycle (not obsolete)'},
  ]},
  {sec:'G',title:'General / Safety',items:[
    {id:'G1',t:'All DPT, PT, TT, FC suitable for hazardous area (Ex certification available)'},
    {id:'G2',t:'Metering skid elevated from ground (no water logging risk)'},
    {id:'G3',t:'All unused ports of DPT/PT/TT/RTD/FC properly plugged'},

USM:[
  {sec:'A',title:'Meter Identification & Physical',items:[

let deferredInstallPrompt=null;

// ═══════════════════════════════════════════════════════════
// PERSISTENCE
// ═══════════════════════════════════════════════════════════
function loadData(){
  try{
    const s=localStorage.getItem('ongc_v6');
    if(s){state=JSON.parse(s);
      if(!state.description.calSchedules)state.description.calSchedules={};
      if(!state.description.calTags)state.description.calTags={};
    }
  }catch(e){}
  METER_TYPES.forEach(t=>{if(!state.meters[t])state.meters[t]=[];if(state.activeMeters[t]===undefined)state.activeMeters[t]=0;});
  if(!state.assetData?.rows)state.assetData=defaultState().assetData;
}
function saveData(quiet){
  localStorage.setItem('ongc_v6',JSON.stringify(state));
  if(!quiet)showToast('✓ Saved');
}
function resetAll(){
  if(!confirm('Reset ALL data? This cannot be undone.'))return;
  localStorage.removeItem('ongc_v6');
  state=defaultState();
  METER_TYPES.forEach(t=>{state.meters[t]=[];state.activeMeters[t]=0;});
  activeMeterType='Orifice';
  navigate('cover');showToast('✓ Reset complete');
}

  document.getElementById('installBanner').style.display='none';

  showToast('✓ App installed!');
});
function doInstall(){
  if(!deferredInstallPrompt)return;
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.then(r=>{
    if(r.outcome==='accepted')showToast('✓ Installing...');
    deferredInstallPrompt=null;
    document.getElementById('installBanner').style.display='none';

}

function addSchedTag(key){

      <div><div class="fl">Consumer</div><input class="ci" placeholder="Consumer" value="${e(m.header.consumer||'')}" oninput="setMF('${type}',${idx},'consumer',this.value)"></div>
      <div><div class="fl">Make / Model / Serial No.</div><input class="ci" placeholder="Make / Model / S/N" value="${e(m.header.make||'')}" oninput="setMF('${type}',${idx},'make',this.value)"></div>

function setMF(type,idx,field,val){

function renderProg(type,idx){

              <input class="ci" placeholder="Remarks..." value="${e(d.rem||'')}" data-mtype="${type}" data-midx="${idx}" data-cpid="${item.id}" data-field="rem"></div>
          </div></div>`;}).join('')}
      </div></div>`).join('');}
function addM(type){
  if(!state.meters[type])state.meters[type]=[];

function renderImport(){return`
  <div class="ptitle">Import Excel Files</div>
  <div class="imp-zone" id="dropZone">
    <input type="file" id="fileInput" accept=".xlsx,.xls" multiple onchange="handleFiles(this.files)">
    <div class="icon">📥</div>
    <p><strong>Tap to select</strong> or drag & drop Excel files here</p>
    <p style="margin-top:4px;font-size:11px">Supports multiple files — data merges into current state</p>
  </div>
  <div class="imp-log" id="impLog" style="display:none"></div>
  <div style="margin-top:12px;font-size:11px;color:var(--text2);line-height:1.6">
    <div style="font-weight:600;color:var(--text);margin-bottom:6px">What gets imported:</div>
    • <strong>Description sheet</strong> — Flow meter list and calibration schedule compliance<br>
    • <strong>All meter sheets</strong> — Orifice, USM, MFM, TFM, Flare Meter, GC, Weighbridge<br>
    • <strong>Data sheet</strong> — Asset data values<br>
    • Multiple meters per sheet are each imported as separate meter instances<br>
    • Existing data is preserved — imported data is merged (appended)
  </div>`;}

function handleFiles(files){
  const log=document.getElementById('impLog');
  log.style.display='block';log.innerHTML='';
  Array.from(files).forEach(file=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const wb=XLSX.read(ev.target.result,{type:'array'});
        importWorkbook(wb,file.name,log);
        saveData(true);
        showToast(`✓ Imported ${file.name}`);
      }catch(err){
        addLog(log,'err',`✗ ${file.name}: ${err.message}`);
      }
    };
    reader.readAsArrayBuffer(file);
  });
}

// ── Drag & drop
document.addEventListener('dragover',ev=>{ev.preventDefault();document.getElementById('dropZone')?.classList.add('drag');});
document.addEventListener('dragleave',()=>document.getElementById('dropZone')?.classList.remove('drag'));
document.addEventListener('drop',ev=>{
  ev.preventDefault();document.getElementById('dropZone')?.classList.remove('drag');
  handleFiles(ev.dataTransfer?.files||[]);
});

function addLog(log,cls,msg){
  const d=document.createElement('div');
  d.className=cls;d.textContent=msg;
  log.appendChild(d);log.scrollTop=log.scrollHeight;
}

// ═══════════════════════════════════════════════════════════
// EXCEL IMPORT ENGINE
// ═══════════════════════════════════════════════════════════
function importWorkbook(wb,fname,log){
  addLog(log,'warn',`━━ Importing: ${fname} ━━`);

  wb.SheetNames.forEach(sheetName=>{
    const ws=wb.Sheets[sheetName];
    const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});
    const key=sheetName.toLowerCase().trim();

    if(key==='description'){
      importDescription(raw,log);
    } else if(key==='data'){
      importAssetData(raw,log);
    } else {
      // find meter type
      let mtype=null;
      for(const [k,v] of Object.entries(SHEET_TO_TYPE)){
        if(key===k||key.startsWith(k)){mtype=v;break;}
      }
      if(mtype){
        importMeterSheet(raw,mtype,sheetName,log);
      } else {
        addLog(log,'warn',`  ⚠ Skipped unknown sheet: "${sheetName}"`);
      }
    }
  });
}

// ── Import Description sheet ────────────────────────────────
function importDescription(rows,log){
  if(!rows.length)return;
  // Find Flow Meter Details table — look for SN column
  let fmdStart=-1;
  for(let i=0;i<rows.length;i++){
    if(String(rows[i][0]).trim()==='SN'||String(rows[i][0]).trim()==='1'){
      // Check if row i-1 or i has the headers we expect
      const r=rows[i];
      if(r.length>=4&&(String(r[1]).toLowerCase().includes('install')||String(r[0]).toLowerCase()==='sn')){
        fmdStart=i;break;
      }
    }
  }
  // Fallback: look for header row
  if(fmdStart===-1){
    for(let i=0;i<rows.length;i++){
      const r=rows[i];
      if(String(r[0]).toLowerCase()==='sn'&&String(r[1]).toLowerCase().includes('install')){fmdStart=i;break;}
    }
  }

  let meterCount=0;
  if(fmdStart>=0){
    for(let i=fmdStart+1;i<rows.length;i++){
      const r=rows[i];
      const sn=String(r[0]||'').trim();
      if(!sn||isNaN(Number(sn)))continue;
      const inst=str(r[1]),desc=str(r[2]),mtype=str(r[3]),tag=str(r[4]),svc=str(r[5]),purpose=str(r[6]),lastCal=str(r[7]),freq=str(r[8]),remarks=str(r[10]||r[9]||'');
      if(!inst&&!tag&&!mtype)continue;
      // Check not duplicate
      const exists=state.description.meterList.some(m=>m.tag===tag&&tag);
      if(!exists){
        state.description.meterList.push({inst,desc,type:mapMeterType(mtype),tag,service:svc,purpose:mapPurpose(purpose),lastCal:normaliseDate(lastCal),freq,remarks});
        meterCount++;
      }
    }
    addLog(log,'ok',`  ✓ Description: ${meterCount} meter(s) imported`);
  }

  // Find calibration schedule compliance data
  // Look for "Orifice", "USM", "MFM" etc. type rows
  importCalSchedules(rows,log);
}

function importCalSchedules(rows,log){
  // Map from Excel schedule row label → CAL_SCHEDULES key (case-insensitive)
  const typeMap={
    'orifice':'orifice','usm':'usm','mfm':'mfm',
    'turbine meter':'tfm','turbine':'tfm','coriolis':'mfm',
    'flow computer':'fc','metering system':'ms'
  };
  let currentKey=null;
  let tags=null;
  let compCount=0;

  for(let i=0;i<rows.length;i++){
    const r=rows[i];
    const col0=str(r[0]).toLowerCase().trim();
    const col1=str(r[1]).toLowerCase().trim();
    const col2=str(r[2]).toLowerCase().trim();

    // Detect header row: "Type of Meter" in col0 with tags in cols 3+
    if((col0==='type of meter'||col0==='type of meter ')&&col1==='activity'&&col2==='schedule'){
      // Extract tags from columns 3 onwards
      const potentialTags=r.slice(3).map(v=>str(v)).filter(v=>v&&v!==''&&!v.toLowerCase().includes('remarks')&&!v.toLowerCase().includes('meter tag'));
      if(potentialTags.length>0)tags=potentialTags;
      continue;
    }

    // Detect meter type data row
    let detectedKey=null;
    for(const [label,key] of Object.entries(typeMap)){
      if(col0===label||col0.startsWith(label.split(' ')[0])){
        detectedKey=key;
        break;
      }
    }
    if(detectedKey)currentKey=detectedKey;
    if(!currentKey||!tags)continue;

    // Detect activity row (col1 has activity text)
    const sched=CAL_SCHEDULES.find(s=>s.key===currentKey);
    if(!sched)continue;

    // Match activity from col1
    let activityRow=-1;
    for(let ri=0;ri<sched.rows.length;ri++){
      const schedActivity=sched.rows[ri].a.toLowerCase();
      if(schedActivity.includes(col1.substring(0,20))||col1.includes(schedActivity.substring(0,15))){
        activityRow=ri;break;
      }
    }
    if(activityRow===-1)continue;

    // Read compliance values for each tag (starting from col 3)
    const dataStart=3;
    tags.forEach((tag,ti)=>{
      const val=str(r[dataStart+ti]||'').trim();
      if(val){
        const k=`${currentKey}_${activityRow}_${ti}`;
        // Map compliance values
        if(val.toLowerCase().includes('complied')||val.toLowerCase()==='complied')
          state.description.calSchedules[k]='Complied';
        else if(val.toLowerCase().includes('not complied')||val.toLowerCase()==='not complied')
          state.description.calSchedules[k]='Not Complied';
        else if(COMP.includes(val))
          state.description.calSchedules[k]=val;
        compCount++;
      }
    });
  }
  // Update tags in state from extracted tags
  if(currentKey&&tags&&(!state.description.calTags[currentKey]||state.description.calTags[currentKey].every(t=>t.startsWith('Meter Tag')))){
    state.description.calTags[currentKey]=[...tags];
  }
  if(compCount>0)addLog(log,'ok',`  ✓ Cal. schedules: ${compCount} compliance entries imported`);
}

// ── Import meter sheet ───────────────────────────────────────
function importMeterSheet(rows,mtype,sheetName,log){
  if(!rows.length)return;
  const cl=CL[mtype];if(!cl)return;

  // Build checkpoint id→text map for fuzzy matching
  const cpMap={};
  cl.forEach(sec=>sec.items.forEach(item=>cpMap[item.id]=item));

  // Find how many meters are in this sheet
  // Header row structure: Row with "Tag No." then alternating value/remarks columns
  let tagRow=-1,headerRow=-1;
  for(let i=0;i<Math.min(rows.length,15);i++){
    const r=rows[i];
    if(r.some(c=>String(c).trim()==='Tag No.')){tagRow=i;break;}
  }
  // Find data header row (SN column)
  for(let i=0;i<Math.min(rows.length,15);i++){
    const r=rows[i];
    if(String(r[0]).trim()==='SN'&&String(r[1]).toLowerCase().includes('checkpoint')){headerRow=i;break;}
  }
  if(headerRow===-1){addLog(log,'warn',`  ⚠ ${sheetName}: Could not find data header row`);return;}

  // Detect meters from tag row
  let meterTags=[];
  if(tagRow>=0){
    const tr=rows[tagRow];
    // Tags are at alternating positions: col2, col4, col6... (each meter = 2 cols: value+remarks)
    for(let c=2;c<tr.length;c+=2){
      const tag=String(tr[c]||'').trim();
      if(tag&&tag.toLowerCase()!=='meter 1'&&tag.toLowerCase()!=='meter 2')meterTags.push({tag,col:c});
      else if(tag)meterTags.push({tag:'',col:c});
    }
    if(meterTags.length===0){
      // try every col from 2
      for(let c=2;c<tr.length;c+=2){meterTags.push({tag:'',col:c});}
    }
  }
  if(meterTags.length===0)meterTags=[{tag:'',col:2}]; // fallback single meter

  // Read header info (Installation, Service, Consumer, Make/Model, Size)
  const headerInfo=[];
  for(let mi=0;mi<meterTags.length;mi++){
    const col=meterTags[mi].col;
    const info={inst:'',svc:'',consumer:'',make:'',size:''};
    for(let i=0;i<headerRow;i++){
      const r=rows[i];const label=String(r[0]||'').toLowerCase().trim();
      const val=String(r[col]||r[col+1]||'').trim();
      if(label.includes('install'))info.inst=val;
      else if(label.includes('service'))info.svc=val;
      else if(label.includes('consumer'))info.consumer=val;
      else if(label.includes('make'))info.make=val;
      else if(label.includes('size'))info.size=val;
    }
    headerInfo.push(info);
  }

  // Determine tag labels
  for(let mi=0;mi<meterTags.length;mi++){
    if(!meterTags[mi].tag){
      meterTags[mi].tag=headerInfo[mi].inst||mtype+' '+(mi+1);
    }
  }

  // Parse checkpoint data
  const meterData=meterTags.map(()=>({}));
  for(let ri=headerRow+1;ri<rows.length;ri++){
    const r=rows[ri];
    const cpid=String(r[0]||'').trim();
    if(!cpid||!cpMap[cpid])continue;
    meterTags.forEach(({col},mi)=>{
      const val=String(r[col]||'').trim();
      const rem=String(r[col+1]||'').trim();
      if(val||rem)meterData[mi][cpid]={val,rem};
    });
  }

  // Add meters to state
  if(!state.meters[mtype])state.meters[mtype]=[];
  let added=0;
  meterTags.forEach(({tag},mi)=>{
    const data=meterData[mi];
    const hasData=Object.keys(data).length>0;
    if(!hasData&&!tag&&mi>0)return; // skip empty trailing meters
    // Check for duplicate tag
    const exists=state.meters[mtype].some(m=>m.label===tag&&tag);
    if(!exists){
      state.meters[mtype].push({
        label:tag||mtype+' '+(state.meters[mtype].length+1),
        header:headerInfo[mi]||{inst:'',svc:'',consumer:'',make:'',size:''},
        data,
      });
      added++;
    }
  });
  addLog(log,'ok',`  ✓ ${sheetName}: ${added} meter(s) imported`);
}

// ── Import Asset Data sheet ──────────────────────────────────
function importAssetData(rows,log){
  let count=0;
  for(const r of rows){
    const desc=str(r[1]||r[0]);const val=str(r[2]||r[1]);const unit=str(r[3]||r[2]);
    if(!desc||desc.toLowerCase().includes('description')||desc.toLowerCase().includes('approx'))continue;
    const existing=state.assetData.rows.find(row=>row.desc.toLowerCase()===desc.toLowerCase());
    if(existing){existing.value=val||existing.value;existing.unit=unit||existing.unit;}
    else if(desc){state.assetData.rows.push({desc,value:val,unit});count++;}
  }
  if(count>0)addLog(log,'ok',`  ✓ Asset Data: ${count} row(s) imported`);
}

// ── Helpers ──────────────────────────────────────────────────
function str(v){return String(v??'').trim();}
function mapMeterType(t){
  const s=t.toLowerCase();
  if(s.includes('orifice'))return'Orifice';if(s.includes('usm'))return'USM';
  if(s.includes('mfm')||s.includes('coriolis'))return'MFM';
  if(s.includes('turbine')||s.includes('tfm'))return'TFM';
  if(s.includes('flare'))return'Flare';if(s.includes('gc'))return'GC';
  if(s.includes('weigh'))return'Weighbridge';return t;
}
function mapPurpose(p){
  const s=p.toLowerCase();
  if(s.includes('ctm'))return'CTM';if(s.includes('pa'))return'PA';
  if(s.includes('flare'))return'Flare';return p;
}
function normaliseDate(d){
  if(!d)return'';
  // Try DD.MM.YYYY → YYYY-MM-DD
  const m=d.match(/(\d{2})\.(\d{2})\.(\d{4})/);
  if(m)return`${m[3]}-${m[2]}-${m[1]}`;
  return d;
}

function attachListeners(){
  document.querySelectorAll('[data-path]').forEach(el=>{
    const evt=el.tagName==='SELECT'||el.type==='date'?'change':'input';
    el.addEventListener(evt,ev=>{setPath(state,ev.target.dataset.path,ev.target.value);saveData(true);});
  });
}
function setPath(obj,path,value){
  const pts=path.replace(/\[(\d+)\]/g,'.$1').split('.');let ref=obj;
  for(let i=0;i<pts.length-1;i++){if(ref[pts[i]]===undefined)ref[pts[i]]={};ref=ref[pts[i]];}
  ref[pts[pts.length-1]]=value;
}
function e(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
